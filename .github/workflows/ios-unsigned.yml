name: Build unsigned iPhone app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Check toolchain
        run: |
          xcodebuild -version
          node --version
          pod --version
      - run: npm ci
      - name: Type check
        run: npx --no-install tsc --noEmit
      - name: Generate iOS project
        run: npx --no-install expo prebuild --platform ios --no-install
      - name: Install native dependencies
        run: pod install --project-directory=ios
      - name: Build and package unsigned Release IPA
        run: bash scripts/build-unsigned-ios.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nanki-unsigned-iphone-${{ github.run_number }}
          path: mobile/build/unsigned/Nanki-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-${{ github.run_number }}
          path: mobile/build/unsigned/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
